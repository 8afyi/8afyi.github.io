name: Submit an Unethical Life Pro Tip
description: Suggest a new entry for the Unethical Life Pro Tips page.
title: "[Tip] "
labels:
  - new-tip
body:
  - type: markdown
    attributes:
      value: |
        Everything on this page is satire written for a comedy project. Don't include real names, addresses, or other identifying details about real people.

        All submissions are reviewed manually.
  - type: textarea
    id: tip
    attributes:
      label: Pro tip
      description: Enter the tip here.  Maybe you already wrote it in the title, that's on you, just copy and paste it here.
      placeholder: e.g. "Piss discs"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - General
        - Unwanted contact
        - Home improvement
        - Car stuff
        - To avoid getting caught
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
        - Extreme
    validations:
      required: true